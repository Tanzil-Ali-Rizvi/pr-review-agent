# Planted security bugs. Lines ending in "#@bug" are the ground truth; "#@ok" marks a line where a comment is
# acceptable but not required. Markers are stripped before review.
- id: sec-sql-search
  split: dev
  title: "Add name search to the users API"
  body: "Support filtering users by name prefix for the admin table."
  bugs: [{category: security, severity: high, what: "SQL built with an f-string from request input", keywords: ["sql", "inject"]}]
  before:
    app/users/repo.py: |
      import sqlite3


      def get_user(conn: sqlite3.Connection, user_id: int):
          row = conn.execute("SELECT id, name, email FROM users WHERE id = ?", (user_id,)).fetchone()
          return dict(row) if row else None
  after:
    app/users/repo.py: |
      import sqlite3


      def get_user(conn: sqlite3.Connection, user_id: int):
          row = conn.execute("SELECT id, name, email FROM users WHERE id = ?", (user_id,)).fetchone()
          return dict(row) if row else None


      def search_users(conn: sqlite3.Connection, prefix: str, limit: int = 50):
          query = f"SELECT id, name, email FROM users WHERE name LIKE '{prefix}%' ORDER BY name LIMIT ?"  #@bug
          rows = conn.execute(query, (limit,)).fetchall()
          return [dict(r) for r in rows]

- id: sec-shell-thumbnail
  split: test
  title: "Generate thumbnails for uploaded images"
  body: "Uses ImageMagick to make 256px thumbnails after upload."
  bugs: [{category: security, severity: high, what: "uploaded filename interpolated into a shell command", keywords: ["shell", "command", "inject", "os.system"]}]
  before:
    media/upload.py: |
      import os
      import uuid

      UPLOAD_DIR = "/var/app/uploads"


      def save_upload(file_storage) -> str:
          name = f"{uuid.uuid4().hex}_{file_storage.filename}"
          path = os.path.join(UPLOAD_DIR, name)
          file_storage.save(path)
          return path
  after:
    media/upload.py: |
      import os
      import uuid

      UPLOAD_DIR = "/var/app/uploads"
      THUMB_DIR = "/var/app/thumbs"


      def save_upload(file_storage) -> str:
          name = f"{uuid.uuid4().hex}_{file_storage.filename}"
          path = os.path.join(UPLOAD_DIR, name)
          file_storage.save(path)
          make_thumbnail(path)
          return path


      def make_thumbnail(path: str) -> str:
          out = os.path.join(THUMB_DIR, os.path.basename(path))
          os.system(f"convert {path} -resize 256x256 {out}")  #@bug
          return out

