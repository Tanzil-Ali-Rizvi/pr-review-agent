- id: clean-timeout-raise
  split: test
  title: "Harden the geocoding call"
  body: "Adds a timeout and error handling to the maps API call."
  bugs: []
  before:
    geo/lookup.py: |
      import requests

      GEOCODE_URL = "https://maps.example.com/geocode"


      def geocode(address: str, key: str):
          r = requests.get(GEOCODE_URL, params={"q": address, "key": key})
          return r.json()["results"][0]["location"]
  after:
    geo/lookup.py: |
      import requests

      GEOCODE_URL = "https://maps.example.com/geocode"


      def geocode(address: str, key: str) -> dict | None:
          r = requests.get(GEOCODE_URL, params={"q": address, "key": key}, timeout=10)
          r.raise_for_status()
          results = r.json().get("results") or []
          return results[0]["location"] if results else None

- id: clean-lru-cache
  split: test
  title: "Cache the slugify helper"
  body: "slugify is called thousands of times per page render with repeated titles."
  bugs: []
  before:
    blog/text.py: |
      import re
      import unicodedata


      def slugify(title: str) -> str:
          text = unicodedata.normalize("NFKD", title).encode("ascii", "ignore").decode()
          return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
  after:
    blog/text.py: |
      import re
      import unicodedata
      from functools import lru_cache

      _NON_ALNUM = re.compile(r"[^a-z0-9]+")


      @lru_cache(maxsize=4096)
      def slugify(title: str) -> str:
          text = unicodedata.normalize("NFKD", title).encode("ascii", "ignore").decode()
          return _NON_ALNUM.sub("-", text.lower()).strip("-")

