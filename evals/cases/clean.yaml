- id: clean-dataclass-refactor
  split: test
  title: "Use a dataclass for line items"
  body: "Replaces dicts with a small dataclass; behaviour unchanged."
  bugs: []
  before:
    billing/lines.py: |
      def line_total(line):
          return line["qty"] * line["unit_price"] * (1 - line.get("discount", 0))
  after:
    billing/lines.py: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class LineItem:
          sku: str
          qty: int
          unit_price: float
          discount: float = 0.0

          def __post_init__(self) -> None:
              if self.qty < 0:
                  raise ValueError("qty must not be negative")
              if not 0 <= self.discount < 1:
                  raise ValueError("discount must be in [0, 1)")


      def line_total(line: LineItem) -> float:
          return line.qty * line.unit_price * (1 - line.discount)
