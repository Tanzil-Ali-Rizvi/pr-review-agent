[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "AI pull-request reviewer for Python: ruff + bandit for evidence, an LLM for judgement, a verifier pass, inline GitHub comments."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tanzil Ali Rizvi" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "ruff>=0.6", "bandit>=1.7"]

[project.optional-dependencies]
llm = ["llm-gateway @ git+https://github.com/Tanzil-Ali-Rizvi/llm-gateway@main"]
eval = ["pyyaml>=6"]
app = ["streamlit>=1.50", "pyyaml>=6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6", "streamlit>=1.50"]

[project.scripts]
pr-review = "reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["evals/cases"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
